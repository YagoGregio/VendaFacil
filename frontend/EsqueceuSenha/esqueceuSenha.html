<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<title>Recuperar senha</title>
</head>
<body>
<img class="logo" src="../img/logo.png" alt="Logo" onerror="this.remove()">
<h1>Recuperar senha</h1>
<p class="sub">Informe seu e-mail para receber um código de verificação.</p>
<section class="login-form">
  <form class="bloco" id="formEmail" novalidate>
    <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email"></div>
    <button type="submit">Enviar código</button>
  </form>
  <span id="codigo" class="codigo hidden"></span>
  <form class="bloco hidden" id="formCodigo" novalidate>
    <div><label for="digitado">Digite o código de 6 dígitos</label>
    <input id="digitado" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
    <button type="submit">Confirmar código</button>
  </form>
  <span id="mensagem" class="msg" role="alert"></span>
  <div class="rodape"><a href="../index.html">Voltar ao login</a></div>
</section>
<script src="../js/seguranca.js"></script>
<script src="../js/recuperar.js"></script>
</body>
</html>
