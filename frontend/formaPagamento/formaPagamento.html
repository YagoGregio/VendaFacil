<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="sheetstyle" href="style.css">
    <title>Forma de Pagamento</title>
</head>

<body>
    <h1>Selecione a forma de Pagamento</h1>

    <div class="opcoes">
        <label>
            <input type="radio" name="pagamento" value="pix">
            Pix
        </label>

        <label>
            <input type="radio" name="pagamento" value="cartaoCredito">
            Cartão de Crédito
        </label>

        <label>
            <input type="radio" name="pagamento" value="cartaoDebito">
                Cartão de Debito
        </label>

        <label>
            <input type="radio" name="pagamento" value="dinheiro">
            Dinheiro
        </label>
    </div>
</body>

</html>
